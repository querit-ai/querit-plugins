name: zapier-querit CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: zapier-querit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zapier-querit/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run audit:production
      - run: npm run build
      - run: npm run pack:check
