name: browserbase-querit-demo CI

on:
  pull_request:
    paths:
      - 'browserbase-querit-demo/**'
      - '.github/workflows/browserbase-querit-demo-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'browserbase-querit-demo/**'
      - '.github/workflows/browserbase-querit-demo-ci.yml'

permissions:
  contents: read

concurrency:
  group: browserbase-querit-demo-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: browserbase-querit-demo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: browserbase-querit-demo/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run pack
