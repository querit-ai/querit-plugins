name: n8n-querit CI

on:
  pull_request:
    paths:
      - 'n8n-nodes-querit/**'
      - '.github/workflows/n8n-querit-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'n8n-nodes-querit/**'
      - '.github/workflows/n8n-querit-ci.yml'

permissions:
  contents: read

concurrency:
  group: n8n-querit-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: n8n-nodes-querit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: n8n-nodes-querit/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run check

      - name: Lint node package
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Inspect npm package
        run: npm run pack
