name: magpie-querit CI

on:
  pull_request:
    paths:
      - 'magpie-querit/**'
      - '.github/workflows/magpie-querit-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'magpie-querit/**'
      - '.github/workflows/magpie-querit-ci.yml'

permissions:
  contents: read

concurrency:
  group: magpie-querit-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: magpie-querit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: magpie-querit/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      # The package ships its sources; nothing may depend on a build step.
      - run: npm pack --dry-run
